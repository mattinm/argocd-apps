{{- range .Values.applications }}
{{- $config := $.Values.config -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name | quote }}
  namespace: argocd
  {{- if not (.finalizers).disabled }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
spec:
  destination:
    namespace: {{ .namespace | default .name | quote }}
    server: {{ $config.spec.destination.server | quote }}
  project: default
  {{- if (.helm).chart }}
  sources:
    - repoURL: {{ .helm.repoURL | quote }}
      chart: {{ .helm.chart }}
      targetRevision: {{ .helm.targetRevision }}
      helm:
        valueFiles:
        {{- if (.helm).valueFiles }}
          {{- range .helm.valueFiles }} 
          - {{ . }}
          {{- end }}
        {{- else }}
          - $values/{{ .path | default .name }}/values.yaml
        {{- end }}
    - repoURL: {{ $config.spec.source.repoURL | quote }}
      targetRevision: {{ $config.spec.source.targetRevision }}
      ref: values
  {{- else }}
  source:
    path: {{ .path | default .name | quote }}
    repoURL: {{ $config.spec.source.repoURL }}
    targetRevision: {{ $config.spec.source.targetRevision }}
  {{- end }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
---
{{ end -}}
