namespace: "cert-manager"
replicaCount: 1

crds:
  enabled: true
  keep: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 150m
    memory: 256Mi

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
